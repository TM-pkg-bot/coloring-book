<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="색칠놀이">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>크레용 색칠놀이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root {
    --paper: #F3ECDF;
    --sheet: #FFFFFF;
    --ink: #4A4038;
    --chrome: #FFF8EC;
    --accent: #FF8A3D;
    --line: #E4D9C4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Jua', 'Apple SD Gothic Neo', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    position: fixed; inset: 0; overflow: hidden;
  }
  button {
    font-family: inherit; font-size: 17px; color: var(--ink);
    background: #FFFFFF; border: 2px solid var(--line);
    border-radius: 14px; padding: 10px 14px;
    min-height: 52px; min-width: 52px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer; touch-action: manipulation;
  }
  button:active { transform: scale(0.95); }
  button:disabled { opacity: 0.35; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ── 그림 고르기 화면 ── */
  #picker { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
  #picker header {
    padding: calc(14px + env(safe-area-inset-top)) 20px 10px;
    text-align: center;
  }
  #picker h1 { font-size: 30px; font-weight: normal; letter-spacing: 1px; }
  #picker .sub { font-size: 17px; opacity: 0.75; margin-top: 2px; }
  #pickGrid {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px; padding: 10px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .pick-card {
    background: var(--sheet); border: 3px solid var(--line); border-radius: 20px;
    padding: 8px; display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 3px 8px rgba(90,70,40,0.10);
  }
  .pick-card svg { width: 100%; height: auto; display: block; }
  .pick-card .nm { font-size: 20px; padding: 2px 0 6px; }
  .pick-card img.thumb { width: 100%; height: auto; border-radius: 12px; background: #FFF; }
  .cat-card { justify-content: center; min-height: 190px; gap: 4px; }
  .cat-icon { font-size: 58px; line-height: 1.2; }
  .cat-card .cnt { font-size: 15px; opacity: 0.6; }

  svg .s { stroke:#222; stroke-width:12; fill:#fff; stroke-linecap:round; stroke-linejoin:round; }
  svg .l { stroke:#222; stroke-width:12; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  svg .t { stroke:#222; stroke-width:8; fill:#fff; stroke-linecap:round; stroke-linejoin:round; }
  svg .m { stroke:#222; stroke-width:8; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  svg .k { fill:#222; stroke:none; }

  /* ── 색칠 화면 ── */
  #studio { position: absolute; inset: 0; display: none; flex-direction: column; }
  #studio.show { display: flex; }
  .topbar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
    background: var(--chrome); border-bottom: 2px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .topbar .spacer { flex: 1; }
  .btn-save { background: var(--accent); border-color: var(--accent); color: #FFF; }

  .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px; }
  .sheet-wrap {
    position: relative; background: var(--sheet);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 4px 14px rgba(90,70,40,0.15);
    aspect-ratio: 5 / 4;
    max-width: 100%; max-height: 100%;
  }
  .sheet-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #lineC { pointer-events: none; }

  .bottombar {
    background: var(--chrome); border-top: 2px solid var(--line);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
  }
  .tools { display: flex; gap: 8px; }
  .tool-btn { font-size: 26px; width: 58px; height: 58px; padding: 0; border-radius: 16px; }
  .tool-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent) inset; background: #FFF3E6; }

  .colors {
    display: flex; gap: 9px; flex: 1;
    overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 6px 2px;
  }
  .swatch {
    width: 50px; height: 50px; flex: 0 0 50px; min-width: 50px; min-height: 50px;
    border-radius: 50%; border: 3px solid rgba(0,0,0,0.12); padding: 0;
    transition: transform 0.12s;
  }
  .swatch.selected { transform: scale(1.2); border-color: var(--ink); box-shadow: 0 0 0 3px #FFF, 0 0 0 6px var(--accent); }
  .swatch.rainbow { background: conic-gradient(#FF5252,#FFD93D,#6BCB77,#4D96FF,#9B5DE5,#FF5252); }

  .sizes { display: flex; gap: 8px; }
  .size-btn { width: 50px; height: 50px; border-radius: 50%; padding: 0; min-width: 50px; min-height: 50px; }
  .size-btn .dot { border-radius: 50%; background: var(--ink); }
  .size-btn.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent) inset; }

  /* ── 오버레이 ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(74,64,56,0.55);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .dialog {
    background: var(--chrome); border-radius: 22px; padding: 22px;
    max-width: 620px; width: 100%; max-height: 92%; overflow: auto;
    text-align: center; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .dialog h2 { font-size: 24px; font-weight: normal; }
  .dialog p { font-size: 18px; line-height: 1.5; }
  .dialog img {
    max-width: 100%; max-height: 52vh; margin: 0 auto;
    border: 2px solid var(--line); border-radius: 12px; background: #FFF;
    -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
  }
  .dialog .row { display: flex; gap: 12px; justify-content: center; }
  .btn-danger { background: #FF5252; border-color: #FF5252; color: #FFF; }

  @media (max-width: 700px) {
    .topbar button { font-size: 15px; padding: 8px 10px; min-height: 48px; }
    .tool-btn { width: 52px; height: 52px; }
  }
</style>
</head>
<body>

<!-- ═══ 그림 고르기 ═══ -->
<div id="picker">
  <header>
    <h1>🖍️ 크레용 색칠놀이</h1>
    <div class="sub" id="pickSub">어떤 그림을 색칠할까요?</div>
  </header>
  <div id="pickGrid"></div>
</div>

<!-- ═══ 색칠하기 ═══ -->
<div id="studio">
  <div class="topbar">
    <button id="backBtn">🏠 그림 고르기</button>
    <span class="spacer"></span>
    <button id="undoBtn" disabled>↩️ 되돌리기</button>
    <button id="redoBtn" disabled>↪️ 다시하기</button>
    <button id="resetBtn">🗑️ 처음부터</button>
    <button id="saveBtn" class="btn-save">📷 저장</button>
  </div>
  <div class="stage" id="stage">
    <div class="sheet-wrap" id="sheetWrap">
      <canvas id="fillC"></canvas>
      <canvas id="lineC"></canvas>
    </div>
  </div>
  <div class="bottombar">
    <div class="tools">
      <button class="tool-btn" id="toolFill" aria-label="채우기">🪣</button>
      <button class="tool-btn" id="toolBrush" aria-label="크레용">🖍️</button>
      <button class="tool-btn" id="toolEraser" aria-label="지우개">🧽</button>
    </div>
    <div class="colors" id="colors"></div>
    <div class="sizes" id="sizes"></div>
  </div>
</div>

<div class="overlay" id="saveOverlay">
  <div class="dialog">
    <h2>멋진 작품이 완성됐어요! 🎉</h2>
    <p>아래 그림을 <b>손가락으로 꾹~ 길게 누른 뒤</b><br>"사진에 저장"을 선택하면 사진첩에 저장됩니다.</p>
    <img id="saveImg" alt="완성한 그림">
    <div class="row"><button id="saveClose">닫기</button></div>
  </div>
</div>

<div class="overlay" id="resetOverlay">
  <div class="dialog">
    <h2>처음부터 다시 색칠할까요?</h2>
    <p>지금까지 칠한 색이 모두 지워져요.</p>
    <div class="row">
      <button id="resetCancel">아니요</button>
      <button id="resetOk" class="btn-danger">네, 다시 할래요</button>
    </div>
  </div>
</div>

<script src="art.js"></script>
<script>
(function () {
  'use strict';

  /* ── 밑그림 데이터: art.js(window.ART_CATALOG) ── */
  var CATALOG = window.ART_CATALOG || [];
  var SVG_STYLE = '<style>.s{stroke:#222;stroke-width:12;fill:#fff;stroke-linecap:round;stroke-linejoin:round}.l{stroke:#222;stroke-width:12;fill:none;stroke-linecap:round;stroke-linejoin:round}.t{stroke:#222;stroke-width:8;fill:#fff;stroke-linecap:round;stroke-linejoin:round}.m{stroke:#222;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.k{fill:#222;stroke:none}</style>';
  function artSvg(body) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">' + SVG_STYLE + body + '</svg>';
  }

  var COLORS = ['#FF5252','#FF9F40','#FFD93D','#6BCB77','#2E9E6B','#4D96FF','#2B50AA','#9B5DE5','#FF8FCF','#A06B4A','#8D99AE','#3B3B3B'];
  var SIZES = [6, 14, 28];

  var picker = document.getElementById('picker');
  var studio = document.getElementById('studio');
  var wrap = document.getElementById('sheetWrap');
  var stage = document.getElementById('stage');
  var fillC = document.getElementById('fillC');
  var lineC = document.getElementById('lineC');
  var fctx = fillC.getContext('2d');
  var lctx = lineC.getContext('2d');

  var curItem = null;           // 현재 선택 그림 {name, body|img}
  var mode = 'fill';            // fill | brush | eraser
  var color = COLORS[0];
  var rainbow = false;
  var size = SIZES[1];
  var hue = 20;
  var mask = null;              // 검은 선 픽셀 마스크
  var lineImg = null;           // 밑그림 Image 객체
  var undoStack = [], redoStack = [];
  var MAX_UNDO = 12;
  var drawing = false, activeId = null, penSeen = false, last = null;
  var strokeChanged = false;

  /* ── 그림 고르기 화면 (카테고리 → 그림) ── */
  var grid = document.getElementById('pickGrid');
  var pickSub = document.getElementById('pickSub');

  function showCategories() {
    pickSub.textContent = '어떤 그림을 색칠할까요?';
    grid.innerHTML = '';
    CATALOG.forEach(function (c, ci) {
      if (!c.items.length) return;
      var card = document.createElement('button');
      card.className = 'pick-card cat-card';
      card.innerHTML = '<div class="cat-icon">' + c.icon + '</div><div class="nm">' + c.name + '</div><div class="cnt">' + c.items.length + '장</div>';
      card.addEventListener('click', function () { showDrawings(ci); });
      grid.appendChild(card);
    });
    var blank = document.createElement('button');
    blank.className = 'pick-card cat-card';
    blank.innerHTML = '<div class="cat-icon">✏️</div><div class="nm">빈 도화지</div><div class="cnt">자유롭게!</div>';
    blank.addEventListener('click', function () { openPicture({ name: '빈 도화지' }); });
    grid.appendChild(blank);
    grid.scrollTop = 0;
  }

  function showDrawings(ci) {
    var c = CATALOG[ci];
    pickSub.textContent = c.icon + ' ' + c.name;
    grid.innerHTML = '';
    var back = document.createElement('button');
    back.className = 'pick-card cat-card';
    back.innerHTML = '<div class="cat-icon">⬅️</div><div class="nm">뒤로</div><div class="cnt">카테고리</div>';
    back.addEventListener('click', showCategories);
    grid.appendChild(back);
    c.items.forEach(function (a) {
      var card = document.createElement('button');
      card.className = 'pick-card';
      var thumb = a.img ? '<img class="thumb" loading="lazy" src="' + a.img + '" alt="">'
                        : '<svg viewBox="0 0 1000 800">' + a.body + '</svg>';
      card.innerHTML = thumb + '<div class="nm">' + a.name + '</div>';
      card.addEventListener('click', function () { openPicture(a); });
      grid.appendChild(card);
    });
    grid.scrollTop = 0;
  }
  showCategories();

  function openPicture(item) {
    curItem = item;
    picker.style.display = 'none';
    studio.classList.add('show');
    undoStack = []; redoStack = []; updateUndoUI();
    requestAnimationFrame(function () { setupCanvases(true); });
  }
  document.getElementById('backBtn').addEventListener('click', function () {
    studio.classList.remove('show');
    picker.style.display = 'flex';
  });

  /* ── 캔버스 셋업 (그림 로드/회전 대응) ── */
  function fitSheet() {
    var sw = stage.clientWidth - 20, sh = stage.clientHeight - 20;
    var w = Math.min(sw, sh * 5 / 4);
    var h = w * 4 / 5;
    wrap.style.width = w + 'px';
    wrap.style.height = h + 'px';
  }
  function setupCanvases(fresh) {
    fitSheet();
    var prev = (!fresh && fillC.width) ? fillC.toDataURL() : null;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(wrap.clientWidth * dpr), h = Math.round(wrap.clientHeight * dpr);
    if (!w || !h) return;
    fillC.width = w; fillC.height = h;
    lineC.width = w; lineC.height = h;
    fctx.fillStyle = '#FFFFFF'; fctx.fillRect(0, 0, w, h);
    fctx.lineCap = 'round'; fctx.lineJoin = 'round';
    if (prev) {
      var img = new Image();
      img.onload = function () { fctx.drawImage(img, 0, 0, w, h); };
      img.src = prev;
    }
    loadLineArt();
  }
  function loadLineArt() {
    var w = lineC.width, h = lineC.height;
    lctx.clearRect(0, 0, w, h);
    mask = new Uint8Array(w * h);           // 빈 도화지는 마스크 없음
    if (!curItem || (!curItem.body && !curItem.img)) { lineImg = null; return; }
    var img = new Image();
    img.onload = function () {
      lineImg = img;
      // 흰 배경에 그린 뒤 밝기→투명도로 변환 (흰색 제거, 검은 선만 남김)
      var off = document.createElement('canvas');
      off.width = w; off.height = h;
      var octx = off.getContext('2d');
      octx.fillStyle = '#FFFFFF'; octx.fillRect(0, 0, w, h);
      var sc = Math.min(w / img.width, h / img.height);   // 비율 유지, 여백은 흰색
      var dw = img.width * sc, dh = img.height * sc;
      octx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      var d = octx.getImageData(0, 0, w, h);
      var px = d.data;
      for (var i = 0; i < px.length; i += 4) {
        var lum = (px[i] * 0.299 + px[i+1] * 0.587 + px[i+2] * 0.114);
        var a = 255 - lum;
        px[i] = 34; px[i+1] = 34; px[i+2] = 34; px[i+3] = a;
        if (a > 90) mask[i >> 2] = 1;
      }
      lctx.putImageData(d, 0, 0);
    };
    if (curItem.img) img.src = curItem.img;
    else img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(artSvg(curItem.body));
  }
  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (!studio.classList.contains('show')) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { setupCanvases(false); }, 250);
  });

  /* ── 도구/색/크기 UI ── */
  var toolBtns = { fill: document.getElementById('toolFill'), brush: document.getElementById('toolBrush'), eraser: document.getElementById('toolEraser') };
  Object.keys(toolBtns).forEach(function (k) {
    toolBtns[k].addEventListener('click', function () { setMode(k); });
  });
  function setMode(m) {
    mode = m;
    Object.keys(toolBtns).forEach(function (k) { toolBtns[k].classList.toggle('selected', k === m); });
  }
  setMode('fill');

  var colorsEl = document.getElementById('colors');
  var swatches = [];
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'swatch'; b.style.background = c;
    b.setAttribute('aria-label', '색 ' + c);
    b.addEventListener('click', function () { selectColor(c, false); });
    colorsEl.appendChild(b); swatches.push({ el: b, c: c });
  });
  var rainbowBtn = document.createElement('button');
  rainbowBtn.className = 'swatch rainbow';
  rainbowBtn.setAttribute('aria-label', '무지개색');
  rainbowBtn.addEventListener('click', function () { selectColor(null, true); });
  colorsEl.appendChild(rainbowBtn);
  function selectColor(c, rb) {
    rainbow = rb;
    if (c) color = c;
    swatches.forEach(function (s) { s.el.classList.toggle('selected', !rb && s.c === color); });
    rainbowBtn.classList.toggle('selected', rb);
    if (mode === 'eraser') setMode('fill');
  }
  selectColor(COLORS[0], false);

  var sizesEl = document.getElementById('sizes');
  var sizeBtns = [];
  SIZES.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'size-btn';
    b.setAttribute('aria-label', '굵기 ' + s);
    var d = document.createElement('span');
    d.className = 'dot';
    d.style.width = d.style.height = (9 + i * 8) + 'px';
    b.appendChild(d);
    b.addEventListener('click', function () {
      size = s;
      sizeBtns.forEach(function (x) { x.classList.remove('selected'); });
      b.classList.add('selected');
      if (mode === 'fill') setMode('brush');
    });
    sizesEl.appendChild(b); sizeBtns.push(b);
    if (s === size) b.classList.add('selected');
  });

  /* ── 실행취소 ── */
  var undoBtn = document.getElementById('undoBtn');
  var redoBtn = document.getElementById('redoBtn');
  function pushUndo() {
    undoStack.push(fillC.toDataURL());
    if (undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
    updateUndoUI();
  }
  function restore(dataUrl) {
    var img = new Image();
    img.onload = function () {
      fctx.fillStyle = '#FFFFFF'; fctx.fillRect(0, 0, fillC.width, fillC.height);
      fctx.drawImage(img, 0, 0, fillC.width, fillC.height);
    };
    img.src = dataUrl;
  }
  function updateUndoUI() {
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }
  undoBtn.addEventListener('click', function () {
    if (!undoStack.length) return;
    redoStack.push(fillC.toDataURL());
    restore(undoStack.pop());
    updateUndoUI();
  });
  redoBtn.addEventListener('click', function () {
    if (!redoStack.length) return;
    undoStack.push(fillC.toDataURL());
    restore(redoStack.pop());
    updateUndoUI();
  });

  /* ── 물감통 채우기 (flood fill) ── */
  function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  }
  function pickFillColor() {
    if (!rainbow) return color;
    hue = (hue + 137.5) % 360;
    var c = hslToRgb(hue / 360, 0.85, 0.6);
    return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
  }
  function hslToRgb(h, s, l) {
    var f = function (n) {
      var k = (n + h * 12) % 12;
      var a = s * Math.min(l, 1 - l);
      return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
    };
    return [f(0), f(8), f(4)];
  }
  function floodFill(cssX, cssY) {
    var w = fillC.width, h = fillC.height;
    var scale = w / wrap.clientWidth;
    var x0 = Math.round(cssX * scale), y0 = Math.round(cssY * scale);
    if (x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;
    var start = y0 * w + x0;
    if (mask && mask[start]) return;            // 선 위를 누르면 무시
    pushUndo();
    var rgb = hexToRgb(pickFillColor());
    var col = (255 << 24) | (rgb[2] << 16) | (rgb[1] << 8) | rgb[0];
    var imgData = fctx.getImageData(0, 0, w, h);
    var buf = new Uint32Array(imgData.data.buffer);
    var visited = new Uint8Array(w * h);
    var stack = [start];
    visited[start] = 1;
    while (stack.length) {
      var i = stack.pop();
      buf[i] = col;
      var x = i % w;
      if (x > 0) step(i - 1);
      if (x < w - 1) step(i + 1);
      if (i >= w) step(i - w);
      if (i < w * h - w) step(i + w);
    }
    function step(j) {
      if (visited[j]) return;
      visited[j] = 1;
      if (mask && mask[j]) { buf[j] = col; return; }   // 선 아래로 1px 침투(흰 틈 방지)
      stack.push(j);
    }
    fctx.putImageData(imgData, 0, 0);
  }

  /* ── 크레용/지우개 ── */
  function pos(e) {
    var r = fillC.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure };
  }
  function drawSeg(a, b, type) {
    var dist = Math.hypot(b.x - a.x, b.y - a.y);
    var scale = fillC.width / wrap.clientWidth;
    if (mode === 'eraser') {
      fctx.strokeStyle = '#FFFFFF';
      fctx.lineWidth = size * 2.4 * scale;
    } else {
      if (rainbow) { hue = (hue + dist * 0.6) % 360; var c = hslToRgb(hue / 360, 0.9, 0.55); fctx.strokeStyle = 'rgb(' + c.join(',') + ')'; }
      else fctx.strokeStyle = color;
      var wdt = (type === 'pen' && b.p > 0) ? size * (0.35 + b.p * 1.3) : size;
      fctx.lineWidth = wdt * scale;
    }
    fctx.beginPath();
    fctx.moveTo(a.x * scale, a.y * scale);
    fctx.lineTo(b.x * scale, b.y * scale);
    fctx.stroke();
  }

  wrap.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'pen') penSeen = true;
    if (penSeen && e.pointerType === 'touch') return;
    if (drawing) return;
    e.preventDefault();
    var p = pos(e);
    if (mode === 'fill') { floodFill(p.x, p.y); return; }
    drawing = true; activeId = e.pointerId; strokeChanged = true;
    wrap.setPointerCapture(e.pointerId);
    pushUndo();
    last = p;
    drawSeg(last, { x: p.x + 0.01, y: p.y + 0.01, p: p.p }, e.pointerType);
  });
  wrap.addEventListener('pointermove', function (e) {
    if (!drawing || e.pointerId !== activeId) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (var i = 0; i < evs.length; i++) {
      var p = pos(evs[i]);
      drawSeg(last, p, e.pointerType);
      last = p;
    }
  });
  function endStroke(e) {
    if (e.pointerId !== activeId) return;
    drawing = false; activeId = null; last = null;
  }
  wrap.addEventListener('pointerup', endStroke);
  wrap.addEventListener('pointercancel', endStroke);

  /* ── 처음부터 ── */
  var resetOverlay = document.getElementById('resetOverlay');
  document.getElementById('resetBtn').addEventListener('click', function () { resetOverlay.classList.add('show'); });
  document.getElementById('resetCancel').addEventListener('click', function () { resetOverlay.classList.remove('show'); });
  document.getElementById('resetOk').addEventListener('click', function () {
    pushUndo();
    fctx.fillStyle = '#FFFFFF'; fctx.fillRect(0, 0, fillC.width, fillC.height);
    resetOverlay.classList.remove('show');
  });

  /* ── 저장 ── */
  var saveOverlay = document.getElementById('saveOverlay');
  document.getElementById('saveBtn').addEventListener('click', function () {
    var out = document.createElement('canvas');
    out.width = fillC.width; out.height = fillC.height;
    var octx = out.getContext('2d');
    octx.drawImage(fillC, 0, 0);
    octx.drawImage(lineC, 0, 0);
    document.getElementById('saveImg').src = out.toDataURL('image/png');
    saveOverlay.classList.add('show');
  });
  document.getElementById('saveClose').addEventListener('click', function () { saveOverlay.classList.remove('show'); });

  /* ── iOS 확대/스크롤 방지 ── */
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) {
    if (e.target === fillC || e.target === lineC || e.target === wrap) e.preventDefault();
  }, { passive: false });

  /* ── 렌더링 자가 점검용 (headless 테스트) ── */
  if (location.hash.indexOf('test') >= 0) {
    window.addEventListener('load', function () {
      openPicture(CATALOG[0].items[0]);
      setTimeout(function () {
        floodFill(wrap.clientWidth * 0.45, wrap.clientHeight * 0.45);   // 몸통
        selectColor(COLORS[2], false);
        floodFill(wrap.clientWidth * 0.5, wrap.clientHeight * 0.18);    // 등지느러미 위 배경
      }, 900);
    });
  }
})();
</script>
</body>
</html>
